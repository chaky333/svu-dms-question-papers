<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d20">
  <title>SVU DMS | Question Paper Library</title>
  <meta name="description" content="SVU DMS MBA question paper library. Find, view and share previous semester question papers.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080d20;
      --panel: #101832;
      --panel2: #141f3e;
      --blue: #4385ff;
      --purple: #9c65ff;
      --cyan: #4de5ff;
      --text: #f4f6ff;
      --muted: #a4aecb;
      --border: rgba(153, 174, 255, .17);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 10% 5%, rgba(55, 100, 255, .18), transparent 36%),
        radial-gradient(ellipse at 95% 25%, rgba(155, 74, 255, .13), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 36px));
      margin: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 13, 32, .86);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
    }

    .nav {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .brand-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 8px 28px rgba(83, 109, 255, .35);
      font-size: 23px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      color: #c8d1ef;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--cyan);
    }

    .nav-cta {
      padding: 10px 16px;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--blue), var(--purple));
      color: white;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      align-items: center;
      gap: 40px;
      padding-top: 82px;
      padding-bottom: 75px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(77, 229, 255, .22);
      border-radius: 50px;
      background: rgba(77, 229, 255, .06);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .eyebrow span {
      width: 7px;
      height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--cyan);
    }

    h1 {
      max-width: 690px;
      margin-top: 23px;
      font-size: clamp(38px, 5.6vw, 68px);
      line-height: 1.08;
      letter-spacing: -3px;
      font-weight: 900;
    }

    .gradient-text {
      background: linear-gradient(95deg, #60a5ff, #ae80ff 55%, #55e8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-copy {
      max-width: 570px;
      margin-top: 21px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      padding: 13px 19px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #151f3b;
      color: white;
      font-weight: 700;
      font-size: 13px;
      transition: transform .25s, box-shadow .25s, border-color .25s;
    }

    .btn-primary {
      border: none;
      background: linear-gradient(120deg, #367fff, #8c54f6);
      box-shadow: 0 10px 28px rgba(75, 104, 255, .24);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(70, 112, 255, .2);
    }

    .hero-visual {
      min-height: 350px;
      display: grid;
      place-items: center;
      position: relative;
      perspective: 900px;
    }

    .orb {
      position: absolute;
      width: 285px;
      height: 285px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(100, 97, 255, .24), rgba(63, 126, 255, .05) 65%, transparent 70%);
      animation: breathe 5s ease-in-out infinite;
    }

    .orbit {
      position: absolute;
      width: 305px;
      height: 115px;
      border: 1px solid rgba(112, 162, 255, .45);
      border-radius: 50%;
      transform: rotate(-32deg);
      animation: orbit 12s linear infinite;
    }

    .orbit.two {
      width: 280px;
      height: 110px;
      transform: rotate(52deg);
      border-color: rgba(181, 111, 255, .5);
      animation-direction: reverse;
    }

    .book-scene {
      position: relative;
      z-index: 2;
      transform-style: preserve-3d;
      animation: floatBook 5s ease-in-out infinite;
    }

    .book {
      position: relative;
      width: 188px;
      height: 240px;
      padding: 25px 20px;
      border-radius: 8px 18px 18px 8px;
      border-left: 8px solid #2552b9;
      background: linear-gradient(145deg, #397cff, #6744d8 70%, #292e8b);
      box-shadow: 16px 20px 0 #121b48, 22px 30px 45px rgba(0, 0, 0, .5), inset -8px 0 15px rgba(0, 0, 0, .15);
      transform: rotateY(-17deg) rotateX(5deg);
    }

    .book::after {
      content: "";
      position: absolute;
      right: -13px;
      top: 7px;
      width: 12px;
      height: calc(100% - 14px);
      border-radius: 0 5px 5px 0;
      background: repeating-linear-gradient(to bottom, #f5f6ff 0 3px, #c5d0ef 4px 5px);
    }

    .book-label {
      display: inline-block;
      margin-bottom: 27px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .book h3 {
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: -1px;
    }

    .book p {
      margin-top: 13px;
      color: #dbe5ff;
      font-size: 10px;
    }

    .book-cap {
      position: absolute;
      right: -45px;
      bottom: 30px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(18, 29, 62, .92);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      font-size: 11px;
      font-weight: 800;
      animation: floatBook 4s ease-in-out infinite reverse;
    }

    .section {
      padding: 50px 0 65px;
      scroll-margin-top: 90px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-heading h2 {
      font-size: clamp(25px, 4vw, 35px);
      line-height: 1.2;
      letter-spacing: -1.2px;
    }

    .section-heading p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .section-tag {
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .search-wrap {
      position: relative;
      margin: 26px 0 30px;
    }

    .search-wrap span {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }

    .search-input {
      width: 100%;
      min-height: 58px;
      padding: 15px 18px 15px 52px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: rgba(18, 28, 57, .8);
      color: white;
      outline: none;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(67, 133, 255, .1);
    }

    .semester-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .semester-card {
      min-height: 218px;
      position: relative;
      overflow: hidden;
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(24, 38, 77, .95), rgba(13, 20, 44, .96));
      box-shadow: 0 14px 30px rgba(0, 0, 0, .15), inset 0 1px rgba(255,255,255,.04);
      cursor: pointer;
      transition: transform .3s, border-color .3s, box-shadow .3s;
      transform-style: preserve-3d;
    }

    .semester-card::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      top: -75px;
      right: -55px;
      border-radius: 50%;
      background: var(--glow, rgba(67,133,255,.35));
      filter: blur(4px);
      transition: transform .4s;
    }

    .semester-card:hover {
      transform: translateY(-8px) rotateX(2deg);
      border-color: rgba(104, 145, 255, .6);
      box-shadow: 0 22px 45px rgba(28, 57, 132, .28);
    }

    .semester-card:hover::before {
      transform: scale(1.5);
    }

    .semester-card:nth-child(2) { --glow: rgba(160, 88, 255, .4); }
    .semester-card:nth-child(3) { --glow: rgba(49, 222, 231, .3); }
    .semester-card:nth-child(4) { --glow: rgba(255, 115, 182, .3); }

    .semester-icon {
      position: relative;
      z-index: 1;
      width: 51px;
      height: 51px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 16px;
      background: rgba(255,255,255,.07);
      font-size: 25px;
    }

    .semester-card h3 {
      margin-top: 23px;
      font-size: 19px;
      font-weight: 800;
    }

    .semester-card p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      color: #b6c9ff;
      font-size: 11px;
      font-weight: 700;
    }

    .arrow-circle {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
    }

    .library-panel {
      margin-top: 32px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: linear-gradient(145deg, rgba(17, 27, 55, .94), rgba(12, 18, 39, .97));
      animation: reveal .35s ease both;
    }

    .panel-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .panel-top h3 {
      font-size: 21px;
      line-height: 1.35;
    }

    .panel-top p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .back-btn {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #172344;
      color: #d9e4ff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .subject-btn {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(28, 41, 78, .5);
      color: #edf1ff;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      transition: background .2s, border-color .2s, transform .2s;
    }

    .subject-btn:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: rgba(49, 84, 158, .25);
    }

    .subject-btn span:last-child {
      color: var(--cyan);
      font-size: 19px;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .year-btn {
      padding: 18px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(29, 43, 83, .65);
      color: white;
      font-size: 16px;
      font-weight: 800;
      transition: all .2s;
    }

    .year-btn:hover {
      border-color: var(--purple);
      background: rgba(112, 73, 219, .22);
      transform: translateY(-3px);
    }

    .year-btn small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    .paper-viewer {
      margin-top: 22px;
    }

    .paper-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .paper-info h4 {
      font-size: 16px;
    }

    .paper-info p {
      color: var(--muted);
      font-size: 12px;
    }

    .paper-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .paper-page {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      border-radius: 5px;
      background: white;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
    }

    .empty-state {
      padding: 35px 18px;
      border: 1px dashed rgba(145, 170, 255, .3);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 7px;
      color: white;
      font-size: 16px;
    }

    .upload-section {
      padding: 28px;
      border: 1px solid rgba(115, 112, 255, .3);
      border-radius: 25px;
      background:
        radial-gradient(circle at 100% 0, rgba(138, 79, 255, .14), transparent 36%),
        linear-gradient(145deg, #121d3c, #0d142d);
    }

    .upload-layout {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 35px;
      align-items: start;
    }

    .upload-copy h2 {
      margin-top: 12px;
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.2;
      letter-spacing: -1px;
    }

    .upload-copy p {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }

    .upload-points {
      display: grid;
      gap: 10px;
      margin-top: 22px;
      color: #dbe5ff;
      font-size: 12px;
    }

    .upload-points span::before {
      content: "✓";
      margin-right: 9px;
      color: var(--cyan);
      font-weight: 900;
    }

    .upload-form {
      display: grid;
      gap: 14px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: rgba(8, 14, 32, .5);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: #d9e2ff;
      font-size: 11px;
      font-weight: 700;
    }

    .field input, .field select {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #121e3b;
      color: white;
      font-size: 12px;
    }

    .field select option {
      background: #121e3b;
      color: white;
    }

    .field input[type="file"] {
      padding: 10px;
      color: var(--muted);
    }

    .file-help {
      color: var(--muted);
      font-size: 10px;
    }

    .upload-progress {
      display: none;
      height: 5px;
      overflow: hidden;
      border-radius: 20px;
      background: #273353;
    }

    .upload-progress.active {
      display: block;
    }

    .upload-progress div {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      transition: width .2s;
    }

    .status-message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .status-message.show {
      display: block;
    }

    .status-message.success {
      border: 1px solid rgba(63, 221, 166, .25);
      background: rgba(63, 221, 166, .08);
      color: #87f5c8;
    }

    .status-message.error {
      border: 1px solid rgba(255, 111, 132, .25);
      background: rgba(255, 111, 132, .08);
      color: #ffb1bd;
    }

    .upload-submit {
      width: 100%;
      border: none;
    }

    .upload-submit:disabled {
      cursor: wait;
      opacity: .6;
      transform: none;
    }

    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .footer {
      padding: 30px 0;
      margin-top: 40px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .footer strong {
      color: #dfe7ff;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      max-width: min(360px, calc(100% - 40px));
      padding: 13px 17px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #182647;
      color: white;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
      font-size: 12px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden {
      display: none !important;
    }

    @keyframes floatBook {
      0%, 100% { transform: translateY(0) rotateZ(-1deg); }
      50% { transform: translateY(-13px) rotateZ(1deg); }
    }

    @keyframes orbit {
      from { transform: rotate(-32deg); }
      to { transform: rotate(328deg); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.94); opacity: .65; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 850px) {
      .hero {
        grid-template-columns: 1fr .7fr;
        gap: 15px;
        padding-top: 55px;
      }

      .hero-visual {
        transform: scale(.85);
      }

      .semester-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .upload-layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 26px, 1120px);
      }

      .nav {
        min-height: 66px;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
      }

      .brand {
        font-size: 13px;
      }

      .nav-links {
        gap: 11px;
        font-size: 11px;
      }

      .nav-links a:not(.nav-cta) {
        display: none;
      }

      .nav-cta {
        padding: 9px 11px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding-top: 50px;
        padding-bottom: 35px;
        gap: 0;
      }

      h1 {
        font-size: clamp(39px, 12vw, 57px);
        letter-spacing: -2px;
      }

      .hero-copy {
        font-size: 13px;
      }

      .hero-visual {
