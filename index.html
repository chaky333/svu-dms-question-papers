
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SVU DMS (MBA)</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f1ff;
  color: #292044;
}

header {
  background: linear-gradient(135deg, #4c1d95, #8b5cf6);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0 0 10px;
  font-size: 30px;
}

header p {
  margin: 5px 0;
}

main {
  max-width: 800px;
  margin: 25px auto;
  padding: 0 15px;
}

.panel {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 4px 15px #00000010;
}

h2 {
  color: #5b21b6;
  font-size: 22px;
  overflow-wrap: anywhere;
}

.items {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.item {
  width: 100%;
  padding: 16px;
  border: 1px solid #ddd6fe;
  border-radius: 10px;
  background: #faf8ff;
  color: #4c1d95;
  text-align: left;
  font-size: 16px;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.item:hover {
  background: #ede9fe;
}

.back {
  padding: 11px 16px;
  margin-bottom: 12px;
  border: none;
  border-radius: 8px;
  background: #5b21b6;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.note {
  padding: 15px;
  border-radius: 9px;
  background: #fff7ed;
  color: #9a3412;
  line-height: 1.6;
}

.paper {
  display: block;
  width: 100%;
  height: auto;
  margin: 16px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
}

footer {
  padding: 25px 12px;
  text-align: center;
  color: #6b6385;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>SVU DMS (MBA)</h1>
  <p>Previous Year Question Papers</p>
  <p>Sri Venkateswara University, Tirupati</p>
</header>

<main>
  <div class="panel">
    <div id="content"></div>
  </div>
</main>

<footer>
  SVU DMS (MBA) | Student Question Paper Resource
</footer>

<script>
const subjects = {
  "Semester I": [
    "MANAGEMENT AND ORGANIZATIONAL BEHAVIOUR",
    "MANAGERIAL COMMUNICATION",
    "MANAGERIAL ECONOMICS",
    "ACCOUNTING FOR MANAGERS",
    "QUANTITATIVE ANALYSIS FOR MANAGEMENT DECISIONS",
    "BUSINESS STATISTICS",
    "MODELLING WITH EXCEL",
    "HUMAN VALUES AND PROFESSIONAL ETHICS"
  ],

  "Semester II": [
    "MARKETING MANAGEMENT",
    "HUMAN RESOURCES MANAGEMENT",
    "FINANCIAL MANAGEMENT",
    "PRODUCTION MANAGEMENT",
    "BUSINESS RESEARCH METHODS",
    "OPERATIONS RESEARCH",
    "MANAGEMENT INFORMATION SYSTEMS",
    "LEADERSHIP VALUES, AND STYLES"
  ],

  "Semester III": [
    "Business Environment",
    "Entrepreneurship",
    "Marketing Research",
    "Advertising and Sales Promotion Management",
    "Product and Brand Management",
    "Financial Services",
    "Investment Management",
    "Bank Management",
    "Training & Development",
    "Human Resource Planning",
    "Leadership Development"
  ],

  "Semester IV": [
    "Digital Business Models",
    "Strategic Management",
    "Business Laws",
    "Organization Development",
    "Marketing of Services",
    "Retail Management",
    "Supply Chain Management",
    "International Finance Management",
    "Financial Derivatives",
    "Risk Management and Insurance",
    "Strategic Human Resource Development",
    "Reward Management",
    "Global Human Resource Management",
    "Stress Management"
  ]
};

/*
Add question-paper JPG image links here when available.

Example:
papers["Semester I|MANAGERIAL ECONOMICS|2025"] = [
  "images/managerial-economics-page1.jpg",
  "images/managerial-economics-page2.jpg"
];
*/
const papers = {};

const content = document.getElementById("content");

function makeButton(label, action) {
  const button = document.createElement("button");
  button.className = "item";
  button.textContent = label;
  button.onclick = action;
  return button;
}

/* HOME: SHOW ONLY SEMESTERS */

function showHome() {
  content.innerHTML = `
    <h2>Select Semester</h2>
    <div id="items" class="items"></div>
  `;

  const list = document.getElementById("items");

  Object.keys(subjects).forEach(semester => {
    list.appendChild(
      makeButton(semester, () => showSubjects(semester))
    );
  });
}

/* SHOW SUBJECTS */

function showSubjects(semester) {
  content.innerHTML = `
    <button class="back" id="back">← Back</button>
    <h2>${semester}</h2>
    <div id="items" class="items"></div>
  `;

  document.getElementById("back").onclick = showHome;

  const list = document.getElementById("items");

  subjects[semester].forEach(subject => {
    list.appendChild(
      makeButton(subject, () => showYears(semester, subject))
    );
  });
}

/* SHOW EXAMINATION YEARS */

function showYears(semester, subject) {
  content.innerHTML = `
    <button class="back" id="back">← Back</button>
    <h2>${subject}</h2>
    <p>Select an examination year.</p>
    <div id="items" class="items"></div>
  `;

  document.getElementById("back").onclick =
    () => showSubjects(semester);

  const list = document.getElementById("items");

  ["2025", "2024", "2023", "2022", "2021"].forEach(year => {
    list.appendChild(
      makeButton(year, () => showPaper(semester, subject, year))
    );
  });
}

/* SHOW QUESTION PAPER JPG PAGES */

function showPaper(semester, subject, year) {
  content.innerHTML = `
    <button class="back" id="back">← Back</button>
    <h2>${subject}</h2>
    <p>${semester} | Examination Year: ${year}</p>
    <div id="paperContent"></div>
  `;

  document.getElementById("back").onclick =
    () => showYears(semester, subject);

  const paperContent = document.getElementById("paperContent");
  const key = `${semester}|${subject}|${year}`;
  const pages = papers[key] || [];

  if (pages.length === 0) {
    paperContent.innerHTML = `
      <div class="note">
        <strong>Unavailable</strong><br>
        This question paper has not been added yet.
      </div>
    `;
    return;
  }

  pages.forEach((url, index) => {
    const image = document.createElement("img");
    image.className = "paper";
    image.src = url;
    image.alt = `Question paper page ${index + 1}`;
    image.loading = "lazy";
    paperContent.appendChild(image);
  });
}

showHome();
</script>

</body>
</html>
